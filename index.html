<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RootOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <div id="top" class="topbar">
    <div class="topbar-brand" id="welcomeopen">RootOS</div>
    <div id="timeElement" class="topbar-clock">00:00:00</div>
  </div>

  <!-- Desktop App Icons -->
  <div id="desktopApps" class="desktop-apps">
    <div class="app-icon" id="notesIcon">
      <div class="icon-frame">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </div>
      <p class="icon-label">DevLogs.sh</p>
    </div>
  </div>

  <!-- Welcome Window -->
  <div class="window" id="welcome" style="top: 100px; left: 140px;">
    <div class="windowheader" id="welcomeheader">
      <div class="closebutton" id="welcomeclose"></div>
      <span class="headertext">bash -- root@itzdeep:~#</span>
      <div style="width: 12px;"></div>
    </div>
    <div class="window-content">
      <h2>Welcome to RootOS</h2>
      <p>A web-based desktop environment built for Hack Club Stardance.</p>
      <p class="status-msg">System status: online and listening.</p>
    </div>
  </div>

  <!-- Notes Window -->
  <div class="window" id="notes" style="top: 150px; left: 260px; display: none; width: 500px;">
    <div class="windowheader" id="notesheader">
      <div class="closebutton" id="notesclose"></div>
      <span class="headertext">editor -- devlogs.txt</span>
      <div style="width: 12px;"></div>
    </div>
    <div class="window-content">
      <h2>System Logs</h2>
      <p>Local storage records and mission tasks.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
