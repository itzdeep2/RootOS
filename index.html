<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RootOS</title>
</head>
<body style="margin: 0; background-color: #0b0f19; color: #c9d1d9; font-family: monospace; height: 100vh; overflow: hidden; user-select: none;">

  <!-- Top bar -->
  <div id="top" style="position: absolute; top: 0; left: 0; width: 100%; height: 38px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background-color: rgba(13, 17, 23, 0.95); border-bottom: 1px solid #30363d; box-sizing: border-box; font-size: 14px;">
    <div style="font-weight: bold; color: #58a6ff;">RootOS</div>
    <div id="timeElement">00:00:00</div>
  </div>

  <!-- Welcome Window -->
  <div id="welcome" style="position: absolute; top: 100px; left: 140px; border: 1px solid #30363d; border-radius: 8px; background-color: #161b22; width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
    <div id="welcomeheader" style="padding: 8px 12px; background-color: #0d1117; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e;">
      bash -- root@itzdeep:~#
    </div>
    <div style="padding: 16px;">
      <h2 style="margin-top: 0; color: #f0f6fc;">Welcome to RootOS</h2>
      <p style="font-size: 13px; line-height: 1.5; color: #8b949e;">A web-based desktop environment built for Hack Club Stardance.</p>
      <p style="font-size: 12px; color: #79c0ff;">System status: online and listening.</p>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      document.getElementById("timeElement").innerText = now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();
  </script>
</body>
</html>
